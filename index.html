<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebTV Ao Vivo</title>
    <style>
        body {
            margin: 0;
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            background: #1a1a1a;
            padding: 15px 0;
            text-align: center;
            border-bottom: 2px solid #e50914;
        }
        .live-badge {
            background: #e50914;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
            animation: pulse 1.5s infinite;
        }
        .player-container {
            width: 90%;
            max-width: 1000px;
            margin-top: 30px;
            aspect-ratio: 16 / 9;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <span style="font-size: 1.5rem; font-weight: bold;">WEBTV</span>
        <span class="live-badge">AO VIVO</span>
    </header>

    <div class="player-container">
        <!-- Substitua SEU_ID_DO_VIDEO pelo ID da sua live -->
        <iframe 
            src="https://www.youtube.com/embed/live_stream?channel=UCMtJLw4wJQBZnw6rjCN5rCQ&autoplay=1" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
