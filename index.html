<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha WebTV Ao Vivo</title>
    <style>
        body {
            margin: 0;
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            background: #1a1a1a;
            padding: 15px 0;
            text-align: center;
            border-bottom: 2px solid #e50914;
        }
        .live-badge {
            background: #e50914;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        .player-container {
            width: 95%;
            max-width: 1000px;
            margin-top: 25px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <span style="font-size: 1.4rem; font-weight: bold;">MINHA WEBTV</span>
        <span class="live-badge">AO VIVO</span>
    </header>

    <div class="player-container">
        <!-- Cole o link copiado do celular no lugar do link abaixo -->
        <iframe 
            src="https://vdo.ninja/?view=mQHRiDm&cleanoutput&autostart" 
            allow="autoplay; camera; microphone; fullscreen; picture-in-picture">
        </iframe>
    </div>

</body>
</html>
